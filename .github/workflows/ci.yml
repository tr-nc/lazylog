name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: # Run validation manually; publishing remains tag-only.

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release
        run: cargo build --release --workspace --locked --verbose
      - name: Test release
        run: cargo test --release --workspace --locked --verbose

  msrv:
    name: Rust 1.88 minimum
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check workspace with Rust 1.88
        run: cargo +1.88.0 check --workspace --all-targets --locked

  release:
    runs-on: macos-latest
    needs: [check, msrv]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "lazylog"))')"
          test "$TAG_VERSION" = "$CARGO_VERSION" || {
            echo "Tag version $TAG_VERSION does not match Cargo version $CARGO_VERSION" >&2
            exit 1
          }

      - name: Build release
        run: cargo build --release --locked --verbose

      - name: Archive binary (Preserves +x permission)
        run: |
          cd target/release
          tar -czvf lazylog-macos.tar.gz lazylog

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/lazylog-macos.tar.gz
          # Specify the tag name explicitly so the release action knows which tag to attach to
          tag_name: ${{ github.ref_name }}
          # Auto generate release notes
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release # Wait for the release job to finish uploading the tarball
    runs-on: ubuntu-latest # This action requires a Linux runner
    # Only run this if a tag was pushed (we don't want to update Homebrew on manual branch builds)
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Bump Homebrew formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: lazylog
          homebrew-tap: tr-nc/homebrew-tap
          # github.ref_name contains the tag name (e.g., v0.5.3)
          download-url: https://github.com/tr-nc/lazylog/releases/download/${{ github.ref_name }}/lazylog-macos.tar.gz
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
